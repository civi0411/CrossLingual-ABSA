version: '3.8'

services:
  absa:
    build: .
    container_name: cross_lingual_absa
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./pretrained_models:/workspace/pretrained_models
    # Uncomment the deployment section below to enable GPU acceleration.
    # Note: Requires nvidia-docker runtime installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
    command: /bin/bash